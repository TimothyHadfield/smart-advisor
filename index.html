<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#275d38">
<title>Smart Advisor</title>
<meta name="description" content="Prerequisite flowcharts, semester plans and class schedules for UVU majors, minors and certificates.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head><body>
<header class="top">
  <span class="brand">Smart Advisor</span>
  <button class="prog" id="progName" aria-haspopup="dialog" title="Programs"></button>
  <div class="wtabs" id="wtabs"><button data-tab="flow" class="on">Flowchart</button><button data-tab="sched">Schedule</button></div>
  <button class="icon" id="gear" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5.6" stroke-width="2.6"/><path stroke-width="3.4" d="M12 2.6v4M12 17.4v4M2.6 12h4M17.4 12h4M5.35 5.35l2.8 2.8M15.85 15.85l2.8 2.8M5.35 18.65l2.8-2.8M15.85 8.15l2.8-2.8"/></g></svg></button>
  <button class="icon profile" id="profile" aria-label="Account" title="Account"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8.2" r="4.2"/><path d="M3.8 21c.9-4.4 4.2-6.6 8.2-6.6s7.3 2.2 8.2 6.6"/></g></svg><span id="profileInitial" aria-hidden="true"></span></button>
</header>
<main id="main" data-tab="flow">
  <section class="panel flow" id="flowPanel" aria-label="Flowchart">
    <div class="legend"><div class="lg-items" id="legendItems"><span class="sw done"></span>Taken</div><button type="button" class="lg-fit" id="fitBtn" aria-label="Fit to screen" title="Fit to screen" hidden><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><label class="lg-grades">Grades <input type="checkbox" id="gradesOn" role="switch" checked></label></div>
    <div class="chart" id="chart"><svg class="edges" id="edges"></svg><div class="boxes" id="boxes"></div></div>
    <button type="button" class="ok empty-pick" data-pick>Pick your program</button>
  </section>
  <section class="panel plan" id="planPanel" aria-label="Plan">
    <div class="sum" id="sum"></div>
    <div class="sems" id="sems"></div>
  </section>
  <section class="panel sched" id="schedPanel" aria-label="Schedule">
    <div class="sc-bar">
      <div class="seg sc-terms" id="scTerms"></div>
      <div class="sc-nav"><button type="button" id="scPrev" aria-label="Previous schedule">‹</button><span id="scRank"></span><button type="button" id="scNext" aria-label="Next schedule">›</button></div>
      <button type="button" class="sc-copy" id="scCopy">Copy CRNs</button>
    </div>
    <div class="sc-body">
      <div class="sc-week" id="scWeek"></div>
      <ul class="sc-list" id="scList"></ul>
    </div>
  </section>
</main>
<nav class="tabs" id="tabs">
  <button data-tab="flow" class="on">Flowchart</button>
  <button data-tab="plan">Plan</button>
  <button data-tab="sched">Schedule</button>
</nav>
<dialog id="settings">
  <form method="dialog">
    <label>Start <select id="setStart"></select></label>
    <label>Max credits <select id="setMax"></select></label>
    <label class="sw-row">Summers <input type="checkbox" id="setSummer" role="switch"></label>
    <button type="button" id="importBtn" class="ghost wide">Import audit</button>
    <div class="set-sec">Schedule</div>
    <div class="set-line"><span>Days</span><div class="seg days" id="setDays"><button type="button" data-d="M">M</button><button type="button" data-d="T">T</button><button type="button" data-d="W">W</button><button type="button" data-d="R">Th</button><button type="button" data-d="F">F</button></div></div>
    <div class="set-line"><span>Hours</span><span class="hours"><select id="setAfter" aria-label="Start after"></select>–<select id="setBefore" aria-label="End by"></select></span></div>
    <label>Classes <select id="setMode"><option value="any">Any</option><option value="person">In person</option><option value="online">Online</option></select></label>
    <div class="sw-grid">
      <label class="sw-row">Avoid gaps <input type="checkbox" id="setGaps" role="switch"></label>
      <label class="sw-row">Top rated <input type="checkbox" id="setRmp" role="switch"></label>
      <label class="sw-row">Main campus <input type="checkbox" id="setMain" role="switch"></label>
      <label class="sw-row">Waitlist <input type="checkbox" id="setWait" role="switch"></label>
    </div>
    <div class="row"><button type="button" id="clearDone" class="ghost">Clear taken</button><button value="ok" class="ok">Done</button></div>
    <p class="ver" id="setVer"></p>
  </form>
</dialog>
<dialog id="importDlg" class="imp">
  <form method="dialog">
    <div class="imp-head"><b>Import audit</b><button type="button" class="tip" id="impTip" aria-label="Why">?</button>
      <p class="tiptext" id="impTipText" hidden>Read on this device only. Nothing is uploaded.</p></div>
    <div class="imp-body" id="impStep1">
      <textarea id="impText" placeholder="Paste Wolverine Track audit" spellcheck="false"></textarea>
      <label class="ghost file">Choose PDF<input type="file" id="impFile" accept="application/pdf,.pdf"></label>
    </div>
    <div class="imp-body" id="impStep2" hidden>
      <ul class="imp-list imp-prog" id="impProg" hidden></ul>
      <div class="imp-sum" id="impSum"></div>
      <ul class="imp-list" id="impList"></ul>
      <label class="sw-row">Count in progress <input type="checkbox" id="impIP" role="switch" checked></label>
    </div>
    <div class="row"><button type="button" id="impBack" class="ghost">Cancel</button><button type="button" id="impGo" class="ok">Read</button></div>
  </form>
</dialog>
<dialog id="pick" class="pick">
  <form method="dialog">
    <ul class="chosen" id="pickChosen"></ul>
    <label id="pickYearRow">Catalog <select id="pickYear"></select></label>
    <input type="search" id="pickQ" placeholder="Search" autocomplete="off" spellcheck="false" enterkeyhint="search">
    <div class="seg" id="pickSeg"><button type="button" data-g="major" class="on">Majors</button><button type="button" data-g="minor">Minors</button><button type="button" data-g="cert">Certificates</button></div>
    <ul class="pick-list" id="pickList"></ul>
    <div class="row"><span></span><button value="ok" class="ok">Done</button></div>
  </form>
</dialog>
<dialog id="secDlg" class="pick secs">
  <form method="dialog">
    <div class="sec-head"><b id="secCode"></b><span id="secTitle"></span></div>
    <ul class="pick-list sec-list" id="secList"></ul>
    <div class="row"><button type="button" id="secRemove" class="ghost">Remove</button><button value="ok" class="ok">Done</button></div>
  </form>
</dialog>
<dialog id="addDlg" class="pick">
  <form method="dialog">
    <input type="search" id="addQ" placeholder="Search classes" autocomplete="off" spellcheck="false" enterkeyhint="search">
    <ul class="pick-list" id="addList"></ul>
    <div class="row"><span></span><button value="ok" class="ok">Done</button></div>
  </form>
</dialog>
<dialog id="geDlg" class="pick ge">
  <form method="dialog">
    <div class="sec-head"><b id="geName"></b><span id="geSub"></span></div>
    <input type="search" id="geQ" placeholder="Search" autocomplete="off" spellcheck="false" enterkeyhint="search">
    <ul class="pick-list ge-list" id="geList"></ul>
    <div class="row"><button type="button" id="geUntake" class="ghost">Untake</button><button value="ok" class="ok">Done</button></div>
  </form>
</dialog>
<dialog id="clsDlg" class="cls">
  <form method="dialog">
    <div class="sec-head"><b id="clsCode"></b><span id="clsTitle"></span></div>
    <dl class="cls-facts" id="clsFacts"></dl>
    <label class="sw-row" id="clsTakenRow">Taken <input type="checkbox" id="clsTaken" role="switch"></label>
    <div class="row"><a id="clsReport" class="ghost" target="_blank" rel="noopener">Report a mistake</a><span class="cls-r"><a id="clsCat" class="cls-cat" target="_blank" rel="noopener">Catalog ↗</a><button value="ok" class="ok">Done</button></span></div>
  </form>
</dialog>
<dialog id="trackDlg" class="pick tracks">
  <form method="dialog">
    <div class="sec-head"><b>Your track</b><span id="trackName"></span></div>
    <ul class="pick-list" id="trackList"></ul>
    <div class="row"><span></span><button value="ok" class="ok">Done</button></div>
  </form>
</dialog>
<dialog id="acct" class="acct">
  <form method="dialog">
    <div class="imp-head"><b>Account</b><button type="button" class="tip" id="acctTip" aria-label="Why">?</button>
      <p class="tiptext" id="acctTipText" hidden>Your classes and settings follow you to any device.</p></div>
    <div id="acctOut">
      <button type="button" id="acctGoogle" class="ok wide" disabled>Continue with Google</button>
    </div>
    <div id="acctIn" class="acct-in" hidden>
      <div class="who"><b id="acctName"></b><span id="acctEmail"></span></div>
      <div class="sync" id="acctSync"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.6 9.1 4.7 4.7 0 0 0 7 18.5z"/></svg><span id="acctSyncText"></span></div>
      <button type="button" id="acctMore" class="ghost wide" aria-expanded="false">Account settings</button>
      <div id="acctSettings" hidden><button type="button" id="acctDelete" class="danger wide">Delete account</button></div>
    </div>
    <p class="acct-msg" id="acctMsg"></p>
    <div class="row"><button type="button" id="acctSignOut" class="ghost" hidden>Sign out</button><button value="ok" class="ok">Done</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button type="button" id="toastUndo">Undo</button></div>
<script type="module" src="js/fresh.js"></script>
<script type="module" src="js/app.js"></script>
</body></html>
